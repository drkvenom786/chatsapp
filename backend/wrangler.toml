name = "chatsapp-backend"
main = "src/index.js"
compatibility_date = "2024-01-01"
workers_dev = true

# Cloudflare R2 Bucket for Media Uploads (images, videos, audio, documents)
# Create with: npx wrangler r2 bucket create dschat-media
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "dschat-media"

# Non-secret environment variables can be declared here or set via Cloudflare dashboard
# Secrets like FIREBASE_SERVICE_ACCOUNT or FCM_SERVER_KEY must be set via 'npx wrangler secret put <NAME>'
[vars]
# Optional: Set allowed frontend origins (comma-separated, or leave unset for all origins "*")
# ALLOWED_ORIGINS = "https://your-app.netlify.app"
# Optional: FRONTEND_URL used for push notification click links & icons
# FRONTEND_URL = "https://your-app.netlify.app"
